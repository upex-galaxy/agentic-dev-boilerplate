  project_key: null
  webapp_domain: null

backend:
  backend_repo: null
  backend_stack: null
  backend_entry: null

frontend:
  frontend_repo: null
  frontend_stack: null
  frontend_entry: null
  design_md_path: null

database:
  db_type: null

