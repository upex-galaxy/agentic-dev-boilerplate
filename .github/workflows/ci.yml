name: CI

# Minimal quality gate for the boilerplate itself: repo checks (format, lint,
# types, vars, skills), the root test suite, and the scaffolder's own tests.
#
# Boilerplate-only workflow: packages/ is pruned wholesale from every
# consumer project by create-agentic-dev (TEMPLATE_EXCLUDES), and this
# file's own path is excluded alongside it so it never travels either.
# Not marked as a required check anywhere — informational gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Repo Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Full history: the documentation-contract step below diffs the PR
          # range and reads its commit messages for `Docs-Checked:` trailers.

      - name: Validate env schema (varlock)
        uses: dmno-dev/varlock-action@v1.0.5
        with:
          fail-on-error: true
          show-summary: true
        # First gate, before any dependency is installed: loads .env.schema +
        # .env.core.schema against the job's (empty) environment and writes a
        # REDACTED summary to the job page. The schema requires nothing
        # (ADR-0010), so this proves the pair parses and every typed item
        # accepts an unset value. The action bundles its own varlock; the
        # devDependency pin in package.json is what the local gates use.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `.claude/skills` is a generated, gitignored alias, so a fresh checkout
      # never has it and agents:compat:check fails on it. Generate it the
      # documented way, then fail if regeneration touched anything tracked:
      # agents:compat also rewrites command wrappers, and without this guard
      # it would silently repair committed wrapper drift instead of reporting it.
      - name: Generate harness surfaces
        run: |
          bun run agents:compat
          if [ -n "$(git status --porcelain)" ]; then
            echo "agents:compat changed committed files; run it locally and commit the result:"
            git status --porcelain
            exit 1
          fi

      - name: Repo checks
        run: bun run repo:check

      - name: Documentation Contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/lint-doc-contracts.ts --base "$BASE_SHA" --head "$HEAD_SHA"
        # ADR-0017: a change inside a `LINT.IfChange(label)` region fails the PR
        # unless every page its `LINT.ThenChange(...)` names changed too, or a
        # commit in the PR carries `Docs-Checked: <label> <reason>`. PR events
        # only: a push to main has no PR range (the PR that landed it was checked).

      - name: Tests
        run: bun run test

      - name: Scaffolder tests
        run: bun run --cwd packages/create-agentic-dev test

      - name: Scaffolder manifest check
        run: bun run --cwd packages/create-agentic-dev check:manifest
