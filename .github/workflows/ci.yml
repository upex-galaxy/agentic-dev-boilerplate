name: CI

# Minimal quality gate for the boilerplate itself: repo checks (format, lint,
# types, vars, skills), the root test suite, and the scaffolder's own tests.
# Job consumer-matrix syncs one throwaway downstream project per shape from
# the commit and runs a project's gates there. Job ContractChecks posts one
# check per ci id of the evidence contract (evidence.static in
# .agents/project.yaml), named by that id.
#
# Boilerplate-only workflow: packages/ is pruned wholesale from every
# consumer project by create-agentic-dev (TEMPLATE_EXCLUDES), and this
# file's own path is excluded alongside it so it never travels either.
# Not marked as a required check anywhere — informational gate.

on:
  pull_request:
    branches: [main]
  push:
    # Every branch (owner decision D4: the consumer matrix runs on every push).
    branches: ['**']

jobs:
  quality-gate:
    name: Repo Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Full history: the documentation-contract step below diffs the PR
          # range and reads its commit messages for `Docs-Checked:` trailers.

      - name: Validate env schema (varlock)
        uses: dmno-dev/varlock-action@v1.0.5
        with:
          fail-on-error: true
          show-summary: true
        # First gate, before any dependency is installed: loads .env.schema +
        # .env.core.schema against the job's (empty) environment and writes a
        # REDACTED summary to the job page. The schema requires nothing
        # (ADR-0010), so this proves the pair parses and every typed item
        # accepts an unset value. The action bundles its own varlock; the
        # devDependency pin in package.json is what the local gates use.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `.claude/skills` is a generated, gitignored alias, so a fresh checkout
      # never has it and agents:compat:check fails on it. Generate it the
      # documented way, then fail if regeneration touched anything tracked:
      # agents:compat also rewrites command wrappers, and without this guard
      # it would silently repair committed wrapper drift instead of reporting it.
      - name: Generate harness surfaces
        run: |
          bun run agents:compat
          if [ -n "$(git status --porcelain)" ]; then
            echo "agents:compat changed committed files; run it locally and commit the result:"
            git status --porcelain
            exit 1
          fi

      - name: Repo checks
        run: bun run repo:check

      - name: Documentation Contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/lint-doc-contracts.ts --base "$BASE_SHA" --head "$HEAD_SHA"
        # ADR-0017: a change inside a `LINT.IfChange(label)` region fails the PR
        # unless every page its `LINT.ThenChange(...)` names changed too, or a
        # commit in the PR carries `Docs-Checked: <label> <reason>`. PR events
        # only: a push to main has no PR range (the PR that landed it was checked).

      - name: Tests
        run: bun run test

      - name: Scaffolder tests
        run: bun run --cwd packages/create-agentic-dev test

      - name: Scaffolder manifest check
        run: bun run --cwd packages/create-agentic-dev check:manifest

  ContractChecks:
    # One check per ci id of the evidence contract (evidence.static in
    # .agents/project.yaml), named by the id so a ruleset can require it. The
    # command comes from the contract at the base commit, not from this file.
    # No job-level skip: a skipped job reports success to a required check.
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        id: [lint, types, unit, repo-gates]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # repo:check runs agents:compat:check, which expects the gitignored
      # .claude/skills symlink a workstation has. Only the link is made here:
      # `bun run agents:compat` would also repair what the check exists to catch.
      - name: Workstation alias
        if: matrix.id == 'repo-gates'
        run: |
          if [ -d .agents/skills ] && [ ! -e .claude/skills ]; then
            mkdir -p .claude
            ln -s ../.agents/skills .claude/skills
          fi

      - name: Contract check
        env:
          CHECK_ID: ${{ matrix.id }}
          EDD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -f scripts/edd.ts ]; then
            bun scripts/edd.ts check "$CHECK_ID"
          else
            echo "scripts/edd.ts is not in this checkout: $CHECK_ID has nothing to run"
          fi

  consumer-matrix:
    name: consumer ${{ matrix.leg }}
    # A PR from this repository already got the push run on the same commit;
    # only a fork PR (no push run here) needs its own.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every leg reports: one harness shape failing says nothing about the others.
      fail-fast: false
      matrix:
        leg: [all, claude-only, no-pi-legacy, codex-only, adopted-protected, legacy-updater]
    # One downstream project per shape, synced from this commit with
    # `bun sync --auto` and held to the gates a project runs, so a change that
    # breaks consumers (a test that assumes a harness, a synced page citing a
    # file that does not travel, a self-update over a protected file) is caught
    # here instead of in every project. `legacy-updater` runs the first sync
    # of a project made before the tooling's tests stopped travelling: its old
    # updater runs first. The legs live in
    # packages/consumer-fixture/run-leg.ts; each needs its own runner, since
    # parallel syncs on one machine share the updater's clone directory.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Full history: the fixture rolls the consumer back 30 commits.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consumer leg
        run: bun packages/consumer-fixture/run-leg.ts --leg ${{ matrix.leg }} --out "$RUNNER_TEMP/consumer-fixture"
