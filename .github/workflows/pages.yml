name: GitHub Pages — Docs Hub

# Publishes the "Planos" docs hub to gh-pages:
#   /            -> homepage dashboard (packages/pages-home)
#   /decks/      -> self-contained HTML decks from packages/decks/
#   /onboarding.html -> start-here page (docs/onboarding.html; the rest of
#                   docs/ is read on GitHub and never published)
#
# Boilerplate-only workflow: packages/ is pruned wholesale from every
# consumer project by create-agentic-dev (TEMPLATE_EXCLUDES), and this
# file's own path is excluded alongside it so it never travels either.
# See packages/decks/README.md for the authoring convention.

on:
  push:
    branches: [main]
    paths:
      - 'packages/pages-home/**'
      - 'packages/decks/**'
      - 'docs/onboarding.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs-hub
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build & Deploy Docs Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble Site
        run: |
          mkdir -p _site/decks
          touch _site/.nojekyll

          # Homepage dashboard + standalone pages (multi-harness walkthrough)
          cp packages/pages-home/*.html _site/

          # Start-here page (docs/ itself is not published; only this page is)
          cp docs/onboarding.html _site/onboarding.html

          # Decks: every HTML deck in packages/decks/<skill>/ -> /decks/<skill>/
          cp -R packages/decks/. _site/decks/
          rm -f _site/decks/README.md _site/decks/ROADMAP.md

          # Per-skill decks of the user-level skills: each one ships inside its
          # own folder in upex-galaxy/agentic-user-skills, and the portal deck
          # (packages/decks/user-level-skills/) links to these copies.
          # Non-fatal: without the clone the portal's skill links 404 until the
          # next deploy, and the rest of the site still publishes.
          if git clone --depth 1 --quiet https://github.com/upex-galaxy/agentic-user-skills.git "$RUNNER_TEMP/user-skills"; then
            for deck in "$RUNNER_TEMP"/user-skills/skills/*/how-it-works.*.html; do
              [ -e "$deck" ] || continue
              name=$(basename "$(dirname "$deck")")
              mkdir -p "_site/decks/user-level-skills/$name"
              cp "$deck" "_site/decks/user-level-skills/$name/"
            done
          else
            echo "::warning::agentic-user-skills is not reachable: the per-skill decks were not published this run"
          fi

          echo "Site tree:"
          find _site -maxdepth 2 -type d | sort

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site

      - name: Post Site URL
        run: |
          echo "## Docs Hub" >> $GITHUB_STEP_SUMMARY
          echo "Homepage: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
