# ============================================
# OPT-IN MCP BLOCKS FOR CODEX CLI + CODEX DESKTOP
# ============================================
# The servers this repo runs are declared in `.codex/config.toml` (committed,
# kept in parity with `.mcp.json` and `opencode.jsonc` by
# `bun run agents:compat:check`). A project checkout needs nothing from here.
#
# Each block below is an OPT-IN server the repo does not enable. To add one:
#   1. copy the block into `.codex/config.toml`,
#   2. add the same server to `.mcp.json` and `opencode.jsonc`
#      (docs/mcp/claude.template.json, docs/mcp/opencode.template.json),
#   3. add its variables to `.env` (and `.env.example`), run
#      `bun run harness:env`, then `bun run agents:compat:check`.
#
# Project `.codex/` config loads only in a repository Codex trusts.
#
# SECRETS: Codex never expands `${VAR}` in `args` or in `[X.env]`. Secrets travel
# BY NAME: `env_vars = ["VAR"]` (stdio) or `bearer_token_env_var = "VAR"` (HTTP).
#
# LOADER: every stdio block starts through `bunx -p dotenv-cli@8.0.0 dotenv -o
# -e .env -- <real command>`, the same loader `.codex/config.toml` uses: Codex
# Desktop opened from Finder or the Dock has no process environment for
# `env_vars` to forward, and the loader reads `.env` whatever launched Codex.
# `startup_timeout_sec = 30` covers a cold package fetch plus the loader hop.
#
# `{{VARIABLE}}` marks a NON-secret value to paste by hand (a URL, an org slug).
#
# OAuth on an HTTP server may need `experimental_use_rmcp_client = true`.

# ============================================
# LOCAL (STDIO) SERVERS
# ============================================

# API_HEADERS carries the bearer inside the value and Codex does not
# interpolate it: put the whole `API_HEADERS="Authorization:Bearer <token>"` in .env.
[mcp_servers.openapi]
command = "bunx"
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "npx",
  "-y",
  "@ivotoby/openapi-mcp-server",
  "--tools",
  "dynamic",
]
env_vars = [
  "API_HEADERS",
]

[mcp_servers.openapi.env]
API_BASE_URL = "{{API_BASE_URL}}"
OPENAPI_SPEC_PATH = "{{OPENAPI_SPEC_URL}}"

# DBHub reads its sources from dbhub.toml (start from docs/mcp/dbhub.example.toml).
[mcp_servers.sql]
command = "bunx"
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "npx",
  "-y",
  "@bytebase/dbhub@latest",
  "--config",
  "dbhub.toml",
]

[mcp_servers.shadcn]
command = "bunx"
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "npx",
  "-y",
  "shadcn@latest",
  "mcp",
]

[mcp_servers.slack]
command = "bunx"
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "npx",
  "-y",
  "slack-mcp-server@latest",
  "--transport",
  "stdio",
]
env_vars = [
  "SLACK_MCP_XOXP_TOKEN",
]

[mcp_servers.slack.env]
SLACK_MCP_ADD_MESSAGE_TOOL = "true"
SLACK_MCP_USERS_CACHE = "./.session/mcp/slack/"
SLACK_MCP_CHANNELS_CACHE = "./.session/mcp/slack/"

[mcp_servers.nanobanana]
command = "bunx"
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "uvx",
  "nanobanana-mcp-server@latest",
]
env_vars = [
  "GEMINI_API_KEY",
]

# Atlassian through mcp-remote: OAuth in the browser, no token in .env.
# Opt-in only: acli is the default Jira / Confluence path (`.agents/instructions/agent-tool-resolution.md` section 6).
[mcp_servers.atlassian]
command = "bunx"
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "npx",
  "-y",
  "mcp-remote",
  "https://mcp.atlassian.com/v1/sse",
]

# ============================================
# REMOTE (STREAMABLE HTTP) SERVERS
# ============================================

[mcp_servers.postman]
url = "https://mcp.postman.com/mcp"
bearer_token_env_var = "POSTMAN_API_KEY"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp/{{SENTRY_ORG}}/{{SENTRY_PROJECT}}"

[mcp_servers.vercel]
url = "https://mcp.vercel.com/"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
