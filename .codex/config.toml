# Codex CLI + Desktop read this same file. Instructions come from AGENTS.md and
# skills from .agents/skills/, both natively — neither needs configuring here.
# The MCP inventory below is the Codex-format adapter of the local servers that
# .mcp.json and opencode.jsonc also declare; `bun run agents:compat:check`
# compares the three semantically, so a server added to one host only fails.
# Web search runs at harness level (~/.codex/config.toml), never here: see
# .agents/skills/agentic-dev-core/references/mcp-capabilities.md.
#
# Codex never expands `${VAR}` in args or env values. Every secret is therefore
# forwarded BY NAME (`env_vars`): the stdio servers read them through the .env
# loader below; `[mcp_servers.X.env]` tables hold literal settings only. The parity check compares the .env variable names each host
# depends on, so the command shape may differ from .mcp.json where Codex needs it.

[shell_environment_policy]
inherit = "core"

# EVERY stdio server below starts through a .env loader: `bunx -p
# varlock@1.20.0 varlock run --no-redact-stdout -- <the real command>`.
# `env_vars` forwards variables BY NAME from Codex's own process environment,
# and Codex Desktop opened from Finder or the Dock has none, so without the
# loader those servers started empty. varlock reads .env / .env.local from the
# project root, validated against .env.schema, whatever launched Codex. An
# inherited variable wins over the files (varlock's precedence), which is why
# `bun run codex` refuses to launch on a differing one. `--no-redact-stdout`
# keeps varlock from rewriting the server's JSON-RPC stream on the stdio pipe.
# `env_vars` stays: it is what `bun run agents:compat:check` compares across
# the three hosts.
#
# Needs `bun install` once (the varlock devDependency, same exact pin) and a
# .env in the checkout.
#
# `startup_timeout_sec = 30` on each: Codex waits 10 s by default, and a cold
# `bunx` / `npx` fetch plus the loader hop can pass that before the first
# handshake.

[mcp_servers.context7]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--",
  "bunx",
  "-y",
  "@upstash/context7-mcp",
]

# @supabase/mcp-server-supabase reads SUPABASE_ACCESS_TOKEN from the environment
# when --access-token is absent (documented fallback), so the token is forwarded
# instead of interpolated. The URL and the two keys travel under their .env
# names; the SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY aliases
# that .mcp.json sets are the same three variables, renamed.
[mcp_servers.supabase]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--",
  "bunx",
  "-y",
  "@supabase/mcp-server-supabase@latest",
]
env_vars = [
  "SUPABASE_ACCESS_TOKEN",
  "NEXT_PUBLIC_SUPABASE_URL",
  "SUPABASE_PUBLISHABLE_KEY",
  "SUPABASE_SECRET_KEY",
]

[mcp_servers.n8n]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--",
  "npx",
  "-y",
  "n8n-mcp",
]
env_vars = [
  "N8N_API_URL",
  "N8N_API_KEY",
]

[mcp_servers.n8n.env]
MCP_MODE = "stdio"
LOG_LEVEL = "error"
DISABLE_CONSOLE_OUTPUT = "true"
