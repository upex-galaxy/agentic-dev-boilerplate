# Codex CLI + Desktop read this same file. Instructions come from AGENTS.md and
# skills from .agents/skills/, both natively — neither needs configuring here.
# The MCP inventory below is the Codex-format adapter of the four servers that
# .mcp.json and opencode.jsonc also declare; `bun run agents:compat:check`
# compares the three semantically, so a server added to one host only fails.
#
# Codex never expands `${VAR}` in args or env values. Every secret is therefore
# forwarded BY NAME (`env_vars`, `bearer_token_env_var`): the stdio servers
# read them through the .env loader below, the remote one from the environment
# `bun run codex` loads out of .env; `[mcp_servers.X.env]` tables hold literal
# settings only. The parity check compares the .env variable names each host
# depends on, so the command shape may differ from .mcp.json where Codex needs it.

[shell_environment_policy]
inherit = "core"

# EVERY stdio server below starts through a .env loader: `bunx -p
# dotenv-cli@8.0.0 dotenv -o -e .env -- <the real command>`. `env_vars` forwards
# variables BY NAME from Codex's own process environment, and Codex Desktop
# opened from Finder or the Dock has none, so without the loader those servers
# started empty. The loader reads .env from the project root whatever launched
# Codex; `-o` lets .env win over a stale inherited value, like `bun run codex`.
# `env_vars` stays: it is what `bun run agents:compat:check` compares across
# the three hosts.
#
# Needs `bun install` once (the dotenv-cli devDependency) and a .env in the
# checkout.
#
# `startup_timeout_sec = 30` on each: Codex waits 10 s by default, and a cold
# `bunx` / `npx` fetch plus the loader hop can pass that before the first
# handshake.

[mcp_servers.context7]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "bunx",
  "-y",
  "@upstash/context7-mcp",
]

# Streamable HTTP with the key as a bearer token: the mcp-remote tunnel that
# .mcp.json / opencode.jsonc use only exists to put ${TAVILY_API_KEY} in a URL.
[mcp_servers.tavily]
url = "https://mcp.tavily.com/mcp/"
bearer_token_env_var = "TAVILY_API_KEY"
enabled = true

# @supabase/mcp-server-supabase reads SUPABASE_ACCESS_TOKEN from the environment
# when --access-token is absent (documented fallback), so the token is forwarded
# instead of interpolated. The URL and the two keys travel under their .env
# names; the SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY aliases
# that .mcp.json sets are the same three variables, renamed.
[mcp_servers.supabase]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "bunx",
  "-y",
  "@supabase/mcp-server-supabase@latest",
]
env_vars = [
  "SUPABASE_ACCESS_TOKEN",
  "NEXT_PUBLIC_SUPABASE_URL",
  "SUPABASE_PUBLISHABLE_KEY",
  "SUPABASE_SECRET_KEY",
]

[mcp_servers.n8n]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "dotenv-cli@8.0.0",
  "dotenv",
  "-o",
  "-e",
  ".env",
  "--",
  "npx",
  "-y",
  "n8n-mcp",
]
env_vars = [
  "N8N_API_URL",
  "N8N_API_KEY",
]

[mcp_servers.n8n.env]
MCP_MODE = "stdio"
LOG_LEVEL = "error"
DISABLE_CONSOLE_OUTPUT = "true"
